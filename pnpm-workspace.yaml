# The game (this folder), the admin app (admin/, docs/dev/admin.md), the desktop app
# (desktop/, docs/dev/desktop.md) and WICK, the engine (wick/, docs/wick-roadmap.md).
packages:
  - admin
  - desktop
  - wick/packages/*
  - wick/university
engineStrict: true
onlyBuiltDependencies:
  - electron
  - esbuild
  - ffmpeg-static
# Only for electron-builder's Squirrel target, which desktop/ does not use (it builds NSIS).
ignoredBuiltDependencies:
  - electron-winstaller
